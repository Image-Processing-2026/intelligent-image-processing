[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "intelligent-image-processing"
version = "0.1.0"
description = "Agentic, closed-loop image processing system with classical CV algorithms and VLM orchestration"
readme = "CONTEXT.md"
requires-python = ">=3.10"
authors = [
    { name = "Team Intelligent Image Processing" }
]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "opencv-python-headless>=4.9.0",
    "scikit-image>=0.22.0",
    "numpy>=1.24.0,<2.0.0",
    "pillow>=10.2.0",
    "langgraph>=0.0.30",
    "google-generativeai>=0.4.1",
    "mediapipe>=0.10.11",
    "python-dotenv>=1.0.1",
    "gradio>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "pyiqa>=0.1.9",
    "scipy>=1.14.1",
    "matplotlib>=3.8.0",
]
segmentation = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "transformers>=4.51.0",
    "safetensors>=0.4.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    ".git",
    "__pycache__",
    "data",
    "src/extensions"
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-m 'not real_model'"
markers = [
    "real_model: requires explicitly prepared model checkpoints and dataset fixtures",
]
