# Playbook card — Màu sắc. Không card nào auto_apply: ám màu thường là chủ ý
# (đèn vàng, hoàng hôn, đồ ăn), cần VLM nhìn ngữ cảnh mới quyết định được.

- id: warm-cast-correction
  title: Ám vàng/cam ngoài ý muốn (đèn sợi đốt, cân bằng trắng sai)
  priority: 40
  auto_apply: false
  defects:
    - {types: [color_cast_warm], region: any, min_severity: 1}
  blocked_by: [warm_tone]
  recipe:
    - operation: color_correct
      region: $defect
      params: {temperature_shift: {1: -0.2, 2: -0.35, 3: -0.5}, saturation_scale: 1.0}
  avoid:
    - "Đồ ăn, hoàng hôn, giờ vàng, nến, đèn quán ấm cúng: tông ấm là chủ ý, không khử."
    - "temperature_shift < -0.5: da người tái xanh, mất sức sống."
    - "Chỉ khử một phần (đưa về hơi ấm) thường tự nhiên hơn khử hoàn toàn về trung tính."
  rationale: >-
    color_correct dịch kênh R và B ngược chiều nhau (trục ấm–lạnh); dịch âm làm giảm đỏ và
    tăng lam, bù cho ánh sáng có nhiệt độ màu thấp.
  tags: [color, màu, white balance, cân bằng trắng, warm, ấm, tungsten, temperature]
  sources:
    - "Gonzalez & Woods, Digital Image Processing (4th ed.), ch.6 — color image processing"

- id: cool-cast-correction
  title: Ám xanh lam ngoài ý muốn (bóng râm, đèn huỳnh quang lạnh)
  priority: 40
  auto_apply: false
  defects:
    - {types: [color_cast_cool], region: any, min_severity: 1}
  blocked_by: [cool_tone]
  recipe:
    - operation: color_correct
      region: $defect
      params: {temperature_shift: {1: 0.2, 2: 0.35, 3: 0.5}, saturation_scale: 1.0}
  avoid:
    - "Cảnh tuyết, biển, giờ xanh (blue hour), ảnh đêm thành phố: tông lạnh thường là chủ ý."
    - "Làm ấm da quá mức (shift > 0.5): da ngả cam."
  rationale: >-
    Dịch dương trên trục ấm–lạnh tăng đỏ và giảm lam, bù cho ánh sáng có nhiệt độ màu cao
    như bóng râm ngoài trời.
  tags: [color, màu, white balance, cool, lạnh, shade, temperature]
  sources:
    - "Gonzalez & Woods, Digital Image Processing (4th ed.), ch.6 — color image processing"

- id: green-cast-limits
  title: Ám xanh lá (đèn huỳnh quang) — ngoài khả năng toolbox
  priority: 40
  auto_apply: false
  defects:
    - {types: [color_cast_green], region: any, min_severity: 1}
  recipe: []
  avoid:
    - "Đừng dùng temperature_shift để sửa ám xanh lá: nó chỉ dịch trục đỏ–lam, không có trục tint (xanh lá–tím)."
    - "Có thể giảm nhẹ saturation_scale (0.9) để ám bớt nổi, nhưng đó không phải sửa màu."
  rationale: >-
    Cân bằng trắng đầy đủ cần hai trục: nhiệt độ (đỏ–lam) và tint (xanh lá–tím). Toolbox chỉ
    có trục nhiệt độ nên ám xanh lá chỉ có thể ghi nhận và báo cho người dùng.
  tags: [color, green, tint, fluorescent, huỳnh quang, giới hạn]
  sources:
    - "Gonzalez & Woods, Digital Image Processing (4th ed.), ch.6 — color image processing"

- id: undersaturated
  title: Màu nhạt, thiếu bão hòa
  priority: 35
  auto_apply: false
  defects:
    - {types: [undersaturated], region: any, min_severity: 1}
  blocked_by: [muted_colors]
  recipe:
    - operation: color_correct
      region: $defect
      params: {saturation_scale: {1: 1.1, 2: 1.2, 3: 1.3}, temperature_shift: 0.0}
  avoid:
    - "Ảnh có người: saturation > 1.15 làm da đỏ/cam bất thường."
    - "Tông phim nhạt (faded/matte) là chủ ý thì giữ nguyên."
  rationale: >-
    Nhân kênh S trong HSV tăng độ rực của màu mà không đổi sắc độ (hue) hay độ sáng.
  tags: [saturation, bão hòa, vivid, rực, màu nhạt]
  sources:
    - "Gonzalez & Woods, Digital Image Processing (4th ed.), ch.6 — HSV color model"

- id: oversaturated
  title: Màu quá rực, chói
  priority: 35
  auto_apply: false
  defects:
    - {types: [oversaturated], region: any, min_severity: 1}
  blocked_by: [vivid_colors]
  recipe:
    - operation: color_correct
      region: $defect
      params: {saturation_scale: {1: 0.9, 2: 0.85, 3: 0.8}, temperature_shift: 0.0}
  avoid:
    - "Giảm quá tay (< 0.75): ảnh xám xịt, thiếu sức sống."
  rationale: >-
    Giảm nhẹ kênh S kéo các màu bị đẩy quá mức về vùng tự nhiên, hữu ích khi màu bị bệt mất chi tiết.
  tags: [saturation, bão hòa, oversaturated, chói, màu gắt]
  sources:
    - "Gonzalez & Woods, Digital Image Processing (4th ed.), ch.6 — HSV color model"
