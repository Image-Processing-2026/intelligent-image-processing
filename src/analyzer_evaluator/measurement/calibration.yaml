# Bảng hiệu chỉnh severity (Analysis v2 P2, hợp đồng C4). SINH TỰ ĐỘNG, không sửa tay:
#   python scripts/calibrate_severity.py
# severity = số ngưỡng (tăng dần) mà điểm đạt tới; điểm tính bằng hàm `score` trong
# src/analyzer_evaluator/measurement/calibration.py. thresholds rỗng = không đo được → (0, 0.0).
version: p2-20261025
date: '2026-10-25'
dataset:
  path: data/synthetic/calibration
  generator: scripts/build_calibration_set.py (seed 7, max side 1024)
  images: 150
  sources:
  - already_good_01
  - already_good_02
  - already_good_03
  - clean_grass_01
  - clean_landscape_01
  measurement_fingerprint: 5fc31d63415d
method: ordinal thresholds minimising sum |severity - label| over all synthetic cases; kept only when
  leave-one-source-out balanced MAE beats the all-zero predictor
reference_long_side: 1024
levels:
  contrast_high_std: 80.0
defects:
  noise:
    score: noise_sigma
    params:
      dark_weight: 0.5
      chroma_weight: 0.669
    fit:
      cases: 150
      positives: 45
      mae_all: 0.14
      loso_mae: 0.2867
      loso_balanced_mae: 0.2937
      null_balanced_mae: 1.0556
    thresholds:
    - 2.8609
    - 2.8609
    - 8.9961
    fitted: true
    reliability: 0.722
  blur:
    score: defocus
    params:
      defocus_bias: 0.1415
    combine_max:
    - motion_blur
    fit:
      cases: 140
      positives: 20
      mae_all: 0.05
      loso_mae: 0.3643
      loso_balanced_mae: 0.4
